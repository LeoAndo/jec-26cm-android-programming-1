<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>中間テスト対策 — Androidプログラミング1</title>
<style>
:root { color-scheme:light; font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif; color:#17324f; background:#f3f7fb; font-size:18px; line-height:1.8; }
* { box-sizing:border-box; } body { margin:0; } main { max-width:1040px; margin:auto; padding:32px 24px 80px; }
h1 { font-size:clamp(1.8rem,5vw,2.5rem); line-height:1.35; margin:8px 0 16px; } h2 { font-size:1.4rem; line-height:1.5; } h3 { font-size:1rem; } p { margin:12px 0; }
.eyebrow { color:#28618d; font-size:.8rem; font-weight:750; letter-spacing:.1em; } .lead,.subtle { color:#486176; }
.panel,.question,#review article,#catalog { background:white; border:1px solid #c9d8e7; border-radius:14px; padding:24px; margin:22px 0; }
.languages { padding:18px 22px; margin:24px 0; background:#e5eff9; border-radius:12px; }
.language-fields,.facts,.actions,.status { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
.language-fields label { display:flex; gap:8px; align-items:center; } select { font:inherit; max-width:100%; border:1px solid #6c8299; border-radius:6px; background:white; color:#17324f; padding:7px 10px; }
.facts { list-style:none; padding:0; gap:10px; } .facts li { background:#e5eff9; border-radius:7px; padding:6px 14px; font-weight:700; }
.mode-grid { display:grid; grid-template-columns:1fr 1fr; gap:20px; } .mode-grid .panel { margin:0; } .mock-card { border-top:5px solid #14579b; } .mode-grid h2 { margin-top:0; }
button { font:inherit; line-height:1.5; padding:12px 20px; border:1px solid #14579b; border-radius:8px; color:white; background:#14579b; cursor:pointer; }
button.secondary { background:white; color:#14579b; } button:hover { filter:brightness(.94); } button:disabled { opacity:.6; cursor:default; }
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible { outline:3px solid #db6c00; outline-offset:3px; }
fieldset { border:0; padding:0; margin:0; min-width:0; } legend { font-weight:700; margin-bottom:12px; } label { cursor:pointer; } .timing label { display:block; margin:10px 0; }
input { accent-color:#14579b; width:20px; height:20px; vertical-align:middle; flex-shrink:0; } input[type=radio] { margin:4px 10px 0 0; }
.status { position:sticky; top:0; z-index:2; justify-content:space-between; background:#e5eff9; padding:8px 20px; border:1px solid #c9d8e7; border-radius:9px; }
.status p { margin:4px 0; } #timer { font-variant-numeric:tabular-nums; } .notice { border-left:4px solid #ad5600; padding-left:14px; color:#713800; }
.question-code { white-space:pre; overflow-x:auto; padding:14px; background:#f3f7fb; border:1px solid #c9d8e7; border-radius:8px; line-height:1.65; font-size:16px; }
.prompt,.option-copy { white-space:pre-wrap; overflow-wrap:anywhere; } code { font-family:ui-monospace,"SFMono-Regular",Consolas,monospace; font-size:.9em; overflow-wrap:anywhere; }
.option { display:flex; gap:6px; align-items:flex-start; padding:12px; margin:10px 0; border:1px solid #c9d8e7; border-radius:8px; }
.option:has(input:checked) { border-color:#14579b; background:#e5eff9; } .letter { font-weight:750; min-width:1.3em; } .option-copy { min-width:0; }
.japanese { display:block; border-top:1px dashed #c9d8e7; padding-top:8px; margin-top:8px; color:#486176; font-size:.92em; }
.source { font-size:.8rem; color:#486176; overflow-wrap:anywhere; } .score { font-size:2.7rem; font-weight:750; margin:8px 0; } .badge { font-weight:750; color:#126342; } .incorrect .badge { color:#a12a26; }
.explanation { border-left:4px solid #14579b; padding-left:16px; } .answer-list { list-style:none; padding:0; } .answer-list li { margin:8px 0; }
#catalog summary { font-weight:700; cursor:pointer; } #catalog article { border-top:1px solid #c9d8e7; padding:20px 0; } #catalog article:last-child { padding-bottom:0; }
.actions { margin-top:20px; } [hidden] { display:none !important; } .small { font-size:.85rem; } footer { margin-top:28px; }
@media(max-width:720px) { main { padding:24px 14px 50px; } .mode-grid { grid-template-columns:1fr; } .panel,.question,#review article,#catalog { padding:18px; } .languages { padding:16px; } .language-fields { align-items:flex-start; flex-direction:column; } .status { padding:8px 12px; font-size:.9rem; } }
@media print { body { background:white; color:black; } main { padding:0; max-width:none; } .languages,button,.actions,#setup,#quiz,#catalog,header,footer { display:none !important; } #review article { break-inside:avoid; border:0; border-bottom:1px solid #888; border-radius:0; } }
</style>
</head>
<body>
<main>
<header><p class="eyebrow">ANDROID PROGRAMMING 1 · A01–A10</p><h1 data-ui="title">中間テスト対策</h1><p class="lead" data-ui="lead">学んだことを、20問ずつ確かめよう。</p></header>
<noscript><p class="notice">この問題集を使うには、ブラウザのJavaScriptを有効にしてください。</p></noscript>
<p id="load-error" class="notice" hidden>問題集を開けませんでした。ファイルをもう一度ダウンロードしてください。</p>
<section class="languages" aria-label="Language">
<div class="language-fields"><label for="language"><span data-ui="language">表示する言語</span><select id="language"></select></label>
<label><input id="bilingual" type="checkbox" checked><span data-ui="showJapanese">日本語を併記する</span></label></div>
<p id="translation-note" class="small" data-ui="translationNote"></p><p id="language-locked" class="small" data-ui="languageLocked" hidden></p>
</section>
<section id="setup">
<ul class="facts"><li data-ui="facts"></li><li data-ui="points"></li><li data-ui="repeat"></li></ul>
<div class="mode-grid">
<section class="panel"><h2 data-ui="practiceTitle"></h2><p data-ui="practiceRules"></p><p class="small" data-ui="practiceCount"></p>
<fieldset class="timing"><legend data-ui="practiceTitle"></legend><label><input type="radio" name="timing" value="untimed" checked><span data-ui="untimed"></span></label><label><input type="radio" name="timing" value="timed"><span data-ui="timed"></span></label></fieldset>
<div class="actions"><button id="start-practice" data-ui="start" disabled></button></div></section>
<section class="panel mock-card"><h2 data-ui="mockTitle"></h2><p data-ui="mockRules"></p><p class="small" data-ui="mockPool"></p>
<div class="actions"><button id="start-mock" data-ui="mockStart" disabled></button></div></section>
</div>
<p class="small subtle" data-ui="privacy"></p><div class="panel"><p data-ui="examDate"></p><p data-ui="examRules"></p></div>
</section>
<section id="quiz" aria-labelledby="quiz-title" hidden>
<h2 id="quiz-title" tabindex="-1" data-ui="quizTitle"></h2><p id="mock-active" class="notice" data-ui="mockActive" hidden></p>
<div class="status"><p><span data-ui="answered"></span><strong id="answered">0</strong> / 20</p><p id="untimed" data-ui="noLimit"></p><p id="timer-box" hidden><span data-ui="remaining"></span><strong id="timer" role="timer">60:00</strong></p></div>
<p data-ui="answerInstructions"></p><form id="quiz-form"><div id="questions"></div><div class="actions"><button type="submit" data-ui="grade"></button></div></form>
<div id="confirm-unanswered" class="panel" role="alert" hidden><p><strong id="unanswered-count"></strong><span data-ui="unansweredConfirm"></span></p><div class="actions"><button id="confirm-grade" data-ui="confirmGrade"></button><button id="keep-answering" class="secondary" data-ui="keepAnswering"></button></div></div>
</section>
<section id="results" aria-labelledby="results-title" hidden><div class="panel"><h2 id="results-title" tabindex="-1" data-ui="results"></h2><p id="expired" class="notice" data-ui="expired" hidden></p><p class="score"><span id="score">0</span><span data-ui="scoreSuffix"></span></p><p><span data-ui="correctPrefix"></span><strong id="correct-count">0</strong><span data-ui="countSuffix"></span><span data-ui="blankPrefix"></span><strong id="blank-count">0</strong><span data-ui="questionSuffix"></span></p><p data-ui="resultHint"></p><div class="actions"><button id="retry" data-ui="retry"></button><button id="choose-mode" class="secondary" data-ui="chooseMode"></button></div></div><div id="review"></div></section>
<details id="catalog"><summary data-ui="catalog"></summary><p class="source" data-ui="sourceHelp"></p><div id="question-bank"></div></details>
<footer><p class="small subtle" data-ui="privacy"></p></footer>
</main>
<!-- MIDTERM_DATA -->
<script>
(() => {
  'use strict';
  try {
    const data = JSON.parse(document.getElementById('midterm-data').textContent);
    const $ = id => document.getElementById(id), letters = ['ア','イ','ウ','エ'];
    const state = {phase:'setup', kind:'practice', timing:'untimed', language:'ja', bilingual:true, questions:[], answers:{}, deadline:null, expired:false};
    let interval = null;
    const language = () => state.phase === 'active' && state.kind === 'mock' ? 'ja' : state.language;
    const ui = key => data.ui[language()][key];
    function content(id, field, choice) {
      const lang = language(), q = data.banks[lang][id], ja = data.banks.ja[id];
      const value = choice === undefined ? q[field] : q[field][choice];
      const original = choice === undefined ? ja[field] : ja[field][choice];
      const tag = field === 'explanation' ? 'div' : 'span';
      const translated = `<${tag} lang="${lang}">${value}</${tag}>`;
      return translated + (lang !== 'ja' && state.bilingual && value !== original ? `<${tag} class="japanese" lang="ja">${original}</${tag}>` : '');
    }
    function shuffle(items) {
      const result = [...items];
      for (let i=result.length-1;i>0;i--) { const j=Math.floor(Math.random()*(i+1)); [result[i],result[j]]=[result[j],result[i]]; }
      return result;
    }
    function expiredNow() { return state.phase === 'active' && state.deadline !== null && Date.now() >= state.deadline; }
    function checkDeadline() { if (expiredNow()) { grade(true); return true; } return false; }
    function tick() {
      if (state.phase !== 'active' || state.deadline === null) return;
      if (checkDeadline()) return;
      const seconds = Math.ceil((state.deadline-Date.now())/1000);
      $('timer').textContent = String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0');
    }
    const questionCode = id => `<pre class="question-code"><code>${data.banks.ja[id].code}</code></pre>`;
    function renderQuestions() {
      $('questions').innerHTML = state.questions.map((q,i) => `<fieldset class="question" data-question-id="${q.id}" aria-describedby="prompt-${q.id}"><legend>${i+1} / 20</legend><div class="prompt" id="prompt-${q.id}">${content(q.id,'prompt')}</div>${questionCode(q.id)}${q.order.map((choice,j) => `<label class="option"><input type="radio" name="${q.id}" value="${choice}"${state.answers[q.id]===choice?' checked':''}><span class="letter">${letters[j]}</span><span class="option-copy">${content(q.id,'choices',choice)}</span></label>`).join('')}</fieldset>`).join('');
      $('answered').textContent = Object.keys(state.answers).length;
    }
    function renderReview() {
      let correct = 0, blank = 0;
      $('review').innerHTML = state.questions.map((q,i) => {
        const answer = data.banks.ja[q.id].answer, chosen = state.answers[q.id], empty = chosen === undefined, right = chosen === answer;
        if (right) correct++; if (empty) blank++;
        const yours = empty ? ui('blank') : `${letters[q.order.indexOf(chosen)]} · ${content(q.id,'choices',chosen)}`;
        return `<article class="${right?'correct':'incorrect'}"><h3>${i+1} / 20 · ${content(q.id,'heading')}</h3><p class="badge">${ui(empty?'blank':right?'correct':'incorrect')}</p><div class="prompt">${content(q.id,'prompt')}</div>${questionCode(q.id)}<ul class="answer-list">${q.order.map((choice,j)=>`<li><strong>${letters[j]}</strong> · ${content(q.id,'choices',choice)}</li>`).join('')}</ul><p>${ui('yours')}${yours}</p><p>${ui('answer')}<strong>${letters[q.order.indexOf(answer)]}</strong></p><div class="explanation">${content(q.id,'explanation')}</div><p class="source">${content(q.id,'source')}</p></article>`;
      }).join('');
      $('score').textContent = correct*5; $('correct-count').textContent = correct; $('blank-count').textContent = blank;
    }
    function renderCatalog() {
      if (!$('catalog').open || state.phase === 'active') { $('question-bank').replaceChildren(); return; }
      $('question-bank').innerHTML = Object.keys(data.banks.ja).map(id => `<article data-id="${id}"><h3>${content(id,'heading')}</h3><div class="prompt">${content(id,'prompt')}</div>${questionCode(id)}<ul class="answer-list">${[0,1,2,3].map((choice,i)=>`<li><strong>${letters[i]}</strong> · ${content(id,'choices',choice)}</li>`).join('')}</ul><div class="explanation">${content(id,'explanation')}</div><p class="source">${content(id,'source')}</p></article>`).join('');
    }
    function render() {
      const lang = language(), locked = state.phase === 'active' && state.kind === 'mock';
      document.documentElement.lang = lang; document.title = data.ui[lang].title + ' — Android Programming 1';
      document.querySelectorAll('[data-ui]').forEach(el => { el.innerHTML = ui(el.dataset.ui); });
      $('language').value = lang; $('language').disabled = locked; $('bilingual').disabled = locked || lang === 'ja'; $('bilingual').checked = state.bilingual;
      $('translation-note').hidden = lang === 'ja'; $('language-locked').hidden = !locked;
      $('setup').hidden = state.phase !== 'setup'; $('quiz').hidden = state.phase !== 'active'; $('results').hidden = state.phase !== 'result';
      $('catalog').hidden = state.phase === 'active'; $('mock-active').hidden = !locked; $('expired').hidden = !state.expired;
      $('untimed').hidden = state.deadline !== null; $('timer-box').hidden = state.deadline === null;
      if (state.phase === 'active') { renderQuestions(); tick(); }
      if (state.phase === 'result') renderReview();
      renderCatalog();
    }
    function start(kind, retry=false) {
      clearInterval(interval);
      state.kind = kind;
      if (!retry) state.timing = kind === 'mock' ? 'timed' : document.querySelector('[name=timing]:checked').value;
      const pool = kind === 'mock' ? data.mockIds : Object.keys(data.banks.ja);
      state.questions = shuffle(data.groups.flatMap(group => ['blank','explain'].flatMap(kind => shuffle(pool.filter(id=>data.banks.ja[id].group===group && data.banks.ja[id].kind===kind)).slice(0,1)))).map(id=>({id,order:shuffle([0,1,2,3])}));
      state.answers = {}; state.phase = 'active'; state.expired = false; state.deadline = state.timing === 'timed' ? Date.now()+60*60*1000 : null;
      $('confirm-unanswered').hidden = true; $('catalog').open = false; $('review').replaceChildren(); $('timer').textContent = '60:00';
      render(); interval = state.deadline === null ? null : setInterval(tick,500); $('quiz-title').focus(); window.scrollTo(0,0);
    }
    function grade(expired=false) {
      if (state.phase !== 'active') return;
      state.phase = 'result'; state.expired = expired; clearInterval(interval);
      $('confirm-unanswered').hidden = true; render(); $('results-title').focus(); window.scrollTo(0,0);
    }
    function submit() {
      if (state.phase !== 'active' || checkDeadline()) return;
      const blank = 20-Object.keys(state.answers).length;
      if (blank) { $('unanswered-count').textContent = blank; $('confirm-unanswered').hidden = false; $('confirm-grade').focus(); }
      else grade();
    }
    data.languages.forEach(lang => { const option=document.createElement('option'); option.value=lang.code; option.textContent=lang.name; option.lang=lang.code; $('language').append(option); });
    $('language').addEventListener('change', event => {
      if (checkDeadline()) return;
      if (state.phase === 'active' && state.kind === 'mock') return;
      state.language = event.target.value; render();
    });
    $('bilingual').addEventListener('change', event => { if (checkDeadline()) return; state.bilingual=event.target.checked; render(); });
    $('start-practice').addEventListener('click', ()=>start('practice')); $('start-mock').addEventListener('click', ()=>start('mock'));
    // 採点はDOMのchecked状態ではなく、この時刻検査を通った回答だけを使う。
    $('quiz-form').addEventListener('change', event => {
      if (state.phase !== 'active' || checkDeadline()) return;
      const input = event.target;
      if (input.matches('input[type=radio]')) { state.answers[input.name]=Number(input.value); $('answered').textContent=Object.keys(state.answers).length; $('confirm-unanswered').hidden=true; }
    });
    $('quiz-form').addEventListener('submit', event=>{event.preventDefault();submit();});
    $('confirm-grade').addEventListener('click', ()=>{if(!checkDeadline())grade();});
    $('keep-answering').addEventListener('click', ()=>{
      if (checkDeadline()) return;
      $('confirm-unanswered').hidden=true; const q=state.questions.find(q=>state.answers[q.id]===undefined); if(q)document.querySelector(`input[name="${q.id}"]`).focus();
    });
    $('retry').addEventListener('click', ()=>start(state.kind,true));
    $('choose-mode').addEventListener('click', ()=>{state.phase='setup';state.deadline=null;state.expired=false;render();$('start-practice').focus();window.scrollTo(0,0);});
    $('catalog').addEventListener('toggle',renderCatalog);
    document.addEventListener('visibilitychange',tick); window.addEventListener('pageshow',tick);
    window.addEventListener('beforeunload',event=>{if(state.phase==='active'){event.preventDefault();event.returnValue='';}});
    $('start-practice').disabled=false; $('start-mock').disabled=false; render();
  } catch(error) { document.getElementById('load-error').hidden=false; console.error(error); }
})();
</script>
</body>
</html>
